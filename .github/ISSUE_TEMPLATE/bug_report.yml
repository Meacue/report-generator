name: 🐛 Bug Report
description: Сообщить о баге
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: Что произошло
      description: Опишите наблюдаемое поведение.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидалось
      description: Какое поведение вы ожидали увидеть.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги для воспроизведения
      description: Пошаговая инструкция.
      placeholder: |
        1. Открыть страницу /reports
        2. Нажать «Сгенерировать»
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Окружение
      placeholder: |
        OS:           Windows 11
        PHP:          8.2.12
        Docker:       24.0.6
        Branch:       master @ commit abc123
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Логи / скриншоты
      description: Если есть.
      render: shell
    validations:
      required: false
