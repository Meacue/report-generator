name: ✨ Feature Request
description: Propose new functionality
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem this solves
      description: Without a problem statement the feature isn't justified.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: High-level is fine.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Endpoint /api/foo returns 200 for a valid request
        - [ ] Covered by a unit test
    validations:
      required: false
