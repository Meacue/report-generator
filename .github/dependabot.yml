# Dependabot version updates.
# Документация: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Все коммиты идут с префиксом "deps:" — он есть в нашем commitlint enum
# и маппится в секцию "Changed" CHANGELOG.md (см. release-please-config.json).
version: 2

updates:
  # ─── Backend (PHP / Composer) ─────────────────────────────────
  - package-ecosystem: "composer"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "deps"
    groups:
      laravel:
        patterns:
          - "laravel/*"
          - "illuminate/*"
        update-types: ["minor", "patch"]
      php-testing:
        patterns:
          - "phpunit/*"
          - "mockery/*"
          - "fakerphp/*"
          - "larastan/*"
          - "nunomaduro/collision"
        update-types: ["minor", "patch"]
      dev-deps:
        dependency-type: "development"
        exclude-patterns:
          - "phpunit/*"
          - "mockery/*"
          - "fakerphp/*"
          - "larastan/*"
        update-types: ["minor", "patch"]

  # ─── Frontend (NPM) ───────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "deps"
    groups:
      # React stack — major bumps идут бандлом (peer-dependencies должны двигаться вместе).
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@vitejs/plugin-react"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "eslint-plugin-*"
          - "typescript-eslint"
        update-types: ["minor", "patch"]
      tanstack:
        patterns:
          - "@tanstack/*"
        update-types: ["minor", "patch"]
      types:
        patterns:
          - "@types/*"
        exclude-patterns:
          - "@types/react"
          - "@types/react-dom"
        update-types: ["minor", "patch"]

  # ─── Root tooling (NPM: lefthook + commitlint) ────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "tooling"
    commit-message:
      prefix: "deps"
    groups:
      commitlint:
        patterns:
          - "@commitlint/*"
        update-types: ["minor", "patch"]

  # ─── GitHub Actions ───────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
